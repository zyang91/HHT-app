name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.language == 'swift'
        with:
          xcode-version: latest-stable
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Autobuild uses `-target HHT`, which can't resolve the local HHTCore
      # package ("no such module 'HHTCore'"). Building the scheme does.
      - name: Build (swift)
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          xcodebuild -project HHT.xcodeproj -scheme HHT \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-xcode \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            build | tail -20
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
