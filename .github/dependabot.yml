version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /analysis
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # HHTCore has no external packages yet; this picks them up once it does.
  - package-ecosystem: swift
    directory: /Packages/HHTCore
    schedule:
      interval: weekly
